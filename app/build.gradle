plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lite.yt480'
    compileSdk 34

    defaultConfig {
        applicationId "com.lite.yt480"
        minSdk 21
        targetSdk 33
        versionCode 5
        versionName "2.1.1"
    }

    // Khóa ký debug cố định (nằm trong repo) để các bản build sau cài đè lên bản trước được,
    // thay vì mỗi lần build trên GitHub lại sinh một khóa ngẫu nhiên khác.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
